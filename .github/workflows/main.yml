
name: Build FBC Laboratory Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'AndroidManifest.xml'
      - 'MainActivity.java'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'ic_launcher.xml'
      - 'styles.xml'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project folders
        run: |
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/java/com/celecytosis/fbclaboratorypro
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/www/
          cp script.js android/app/src/main/assets/www/
          cp style.css android/app/src/main/assets/www/

          cp AndroidManifest.xml android/app/src/main/
          cp MainActivity.java android/app/src/main/java/com/celecytosis/fbclaboratorypro/
          cp ic_launcher.xml android/app/src/main/res/drawable/
          cp styles.xml android/app/src/main/res/values/

          cp build.gradle android/
          cp settings.gradle android/
          cp gradle.properties android/

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.celecytosis.fbclaboratorypro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.celecytosis.fbclaboratorypro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FBC-Laboratory-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
