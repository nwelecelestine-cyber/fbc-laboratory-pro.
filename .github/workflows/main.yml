
name: Build FBC Laboratory Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'AndroidManifest.xml'
      - 'MainActivity.java'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'ic_launcher.xml'
      - 'styles.xml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android project
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/java/com/celecytosis/fbclaboratorypro
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          cp index.html script.js style.css android/app/src/main/assets/www/
          cp AndroidManifest.xml android/app/src/main/
          cp MainActivity.java android/app/src/main/java/com/celecytosis/fbclaboratorypro/
          cp ic_launcher.xml android/app/src/main/res/drawable/
          cp styles.xml android/app/src/main/res/values/

          cp build.gradle settings.gradle gradle.properties android/

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.celecytosis.fbclaboratorypro'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.celecytosis.fbclaboratorypro'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Accept Android SDK licences
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "SDK manager not found"
            exit 1
          fi

          mkdir -p "$ANDROID_HOME/licenses"

          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$ANDROID_HOME/licenses/android-sdk-license"

          printf '%s\n' \
            '601085b94cd77f0b54ff86406957099ebe79c4d6' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FBC-Laboratory-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
